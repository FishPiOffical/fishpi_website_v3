# main仅支持v3；VITE_API_TARGET应指向实际Rhythm v3部署。
upstream fp_node   { server 127.0.0.1:5173; keepalive 32; }
upstream fp_rhythm { server 127.0.0.1:8080; keepalive 32; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name fishpi.cn;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / { proxy_pass http://fp_node; }
    # 保留浏览器Host/Origin/Referer和刷新Cookie，供v3凭据来源检查。
    location ^~ /api/v3/ { proxy_pass http://fp_rhythm; proxy_read_timeout 3600s; }
    location = /api/v3 { proxy_pass http://fp_rhythm; }
    # 不再向旧认证或数据接口转发，即使浏览器仍带fp.apiMode=v1。
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 410 '{"code":410,"msg":"当前站点仅支持 v3 接口"}';
    }
    location = /api { return 410; }
    # 独立服务版本仍为v1，由独立访客Cookie核验身份。
    location ^~ /feedback-api/ { proxy_pass http://fp_node; }
    # v3编辑器使用专用图床票据；这是RhyPic自身接口版本，不是站点v1。
    location = /rhypic-upload/api/v1/files {
        proxy_pass https://pic.fishpi.cn/api/v1/files;
        proxy_ssl_server_name on;
        proxy_set_header Host pic.fishpi.cn;
        client_max_body_size 20m;
    }
    # 保留已有验证码、风控和勋章图片资源；不提供旧用户写入代理。
    location ~ ^/(captcha|test|validateCaptcha|gen)(/|$) { proxy_pass http://fp_rhythm; }
    location ^~ /games/ { proxy_pass http://fp_rhythm; }
    location ^~ /activities/ { proxy_pass http://fp_rhythm; }
    location ^~ /packs/ { proxy_pass http://fp_node; }
}
