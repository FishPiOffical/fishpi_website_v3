# website_v3 生产部署示例
# 默认交给 Node SSR（npm run preview，127.0.0.1:5173）；Rhythm 的接口、WebSocket、
# 游戏/活动静态页、聊天原文等仍转发到 Rhythm。规则与 vite.config.ts 开发代理保持一致。

upstream fp_node   { server 127.0.0.1:5173; keepalive 32; }
upstream fp_rhythm { server 127.0.0.1:8080; keepalive 32; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name fishpi.cn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---------- 默认：SPA / SSR ----------
    location / {
        proxy_pass http://fp_node;
    }

    # ---------- 纯接口前缀：全部转发 Rhythm ----------
    location ~ ^/(api|loginWebInApiKey|captcha|comment|verify|register2|vote|unfollow|user|users|pay|getApiKeyInWeb|report|markdown|invitecode|export|mfa|bag|gen|activities|point|idle-talk)(/|$) {
        proxy_pass http://fp_rhythm;
    }

    # ---------- WebSocket ----------
    location ~ ^/(chat-room-channel|chat-channel|user-channel|article-channel|idle-talk-channel)(/|$) {
        proxy_pass http://fp_rhythm;
        proxy_read_timeout 3600s;
    }
    location ^~ /chat-room/ {
        proxy_pass http://fp_rhythm;
        proxy_read_timeout 3600s;
    }

    # 暂无 JSON 的 Rhythm 页面：大事记（含提交）、数据统计、新人引导
    location ~ ^/(milestones|statistic|guide)(/|$) { proxy_pass http://fp_rhythm; }

    # ---------- 前缀被 SPA 与 Rhythm 共用 ----------

    # 游戏：/games 是 SPA 入口，/games/* 是 Rhythm 托管的游戏页
    location = /games  { proxy_pass http://fp_node; }
    location ^~ /games/ { proxy_pass http://fp_rhythm; }

    # 活动：/activity 是 SPA，/activity/*（小游戏、签到、昨日活跃 API）走 Rhythm
    location = /activity  { proxy_pass http://fp_node; }
    location ^~ /activity/ { proxy_pass http://fp_rhythm; }

    # 聊天室：/cr 是 SPA，/cr/raw/{id} 是 Rhythm 的消息原文页
    location ^~ /cr/raw/ { proxy_pass http://fp_rhythm; }

    # 私信：/chat、/chat/{user} 是 SPA，以下为接口
    location ~ ^/chat/(get-list|get-message|mark-as-read|has-unread|revoke|send)(/|$) {
        proxy_pass http://fp_rhythm;
    }

    # 清风明月：GET /breezemoons 是 SPA；POST /breezemoon、PUT/DELETE /breezemoon/{id} 是接口
    location ^~ /breezemoon {
        if ($request_method !~ ^(GET|HEAD)$) { proxy_pass http://fp_rhythm; }
        proxy_pass http://fp_node;
    }

    # 关注：/following 是 SPA，/follow/* 是接口
    location ^~ /follow/ { proxy_pass http://fp_rhythm; }

    # 帖子：GET /article/{id} 是 SPA；POST 及以下 GET 接口走 Rhythm
    # 注意 /article 不能用 ^~，否则上面的正则不会生效
    location ~ ^/article/(random|[^/]+/revisions)(/|$) { proxy_pass http://fp_rhythm; }
    location /article {
        if ($request_method !~ ^(GET|HEAD)$) { proxy_pass http://fp_rhythm; }
        proxy_pass http://fp_node;
    }

    # 标签：/tags、/tags/{tag} 是 SPA，/tags/query 是接口
    location = /tags/query { proxy_pass http://fp_rhythm; }

    # 设置：GET /settings/* 是 SPA，POST /settings/* 是接口
    location ^~ /settings {
        if ($request_method !~ ^(GET|HEAD)$) { proxy_pass http://fp_rhythm; }
        proxy_pass http://fp_node;
    }

    # 通知、日志：只有路径本身是 SPA，子路径是接口
    location = /notifications  { proxy_pass http://fp_node; }
    location ^~ /notifications/ { proxy_pass http://fp_rhythm; }
    location = /logs  { proxy_pass http://fp_node; }
    location ^~ /logs/ { proxy_pass http://fp_rhythm; }

    # 以下前缀 GET 渲染 SPA，非 GET 走 Rhythm
    location ~ ^/(charge|vips|register|forget-pwd|reset-pwd)(/|$) {
        if ($request_method !~ ^(GET|HEAD)$) { proxy_pass http://fp_rhythm; }
        proxy_pass http://fp_node;
    }
}
